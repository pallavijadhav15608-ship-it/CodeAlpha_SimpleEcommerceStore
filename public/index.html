<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛒 CodeAlpha Store</h1>

    <nav>
        <a href="#products">Products</a>

        <button onclick="showLogin()">Login</button>

        <button onclick="showRegister()">Register</button>

        <button onclick="showCart()">
            Cart (<span id="cartCount">0</span>)
        </button>
    </nav>
</header>

<section class="hero">
    <h2>Welcome to CodeAlpha Store</h2>
    <p>Find quality products at affordable prices.</p>
</section>

<main>
    <h2 id="products">Our Products</h2>

    <div id="productList" class="product-container">
    </div>
</main>


<!-- REGISTER BOX -->

<div id="registerBox" class="auth-box">

    <div class="auth-content">

        <button class="close" onclick="closeAuth()">✕</button>

        <h2>Create Account</h2>

        <input
            type="text"
            id="registerName"
            placeholder="Full Name"
        >

        <input
            type="email"
            id="registerEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="registerPassword"
            placeholder="Password"
        >

        <button onclick="registerUser()">
            Register
        </button>

    </div>

</div>


<!-- LOGIN BOX -->

<div id="loginBox" class="auth-box">

    <div class="auth-content">

        <button class="close" onclick="closeAuth()">✕</button>

        <h2>Login</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button onclick="loginUser()">
            Login
        </button>

    </div>

</div>


<!-- CART -->
 <!-- PRODUCT DETAILS -->

<div id="productDetailsBox" class="auth-box">

    <div class="auth-content">

        <button class="close" onclick="closeProductDetails()">✕</button>

        <h2 id="detailName">Product Name</h2>

        <p id="detailDescription"></p>

        <h3>
            Price: ₹<span id="detailPrice"></span>
        </h3>

        <button onclick="addDetailProductToCart()">
            Add to Cart
        </button>

    </div>

</div>

<div id="cartBox" class="cart-box">

    <div class="cart-content">

        <button class="close" onclick="closeCart()">✕</button>

        <h2>Your Shopping Cart</h2>

        <div id="cartItems"></div>

        <h3>
            Total: ₹<span id="cartTotal">0</span>
        </h3>

        <button class="checkout" onclick="checkout()">
            Place Order
        </button>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
